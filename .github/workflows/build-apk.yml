name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.GLOBERO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: bun install
      - run: bunx cap sync android
      - name: Decode upload keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.GLOBERO_KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
      - name: Build signed release APK + AAB
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon \
            -PGLOBERO_KEYSTORE_FILE=keystore.jks \
            -PGLOBERO_KEYSTORE_PASSWORD="${{ secrets.GLOBERO_KEYSTORE_PASSWORD }}" \
            -PGLOBERO_KEY_ALIAS="${{ secrets.GLOBERO_KEY_ALIAS }}" \
            -PGLOBERO_KEY_PASSWORD="${{ secrets.GLOBERO_KEY_PASSWORD }}"
      - name: Build unsigned release APK + AAB
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: globero-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: globero-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk globero.apk
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Globero Android (latest)
          make_latest: true
          files: globero.apk
    permissions:
      contents: write
